name: Build Android APK and AAB

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android native scaffolding
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --no-pub --platforms=android --org com.unexplay --project-name iptv "$RUNNER_TEMP/iptv-scaffold"
            cp -R "$RUNNER_TEMP/iptv-scaffold/android" ./android
          fi
          python3 tooling/configure_android.py android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run unit tests
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Build Android App Bundle
        run: flutter build appbundle --release --no-pub

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: UNEX-Vision-Android
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
