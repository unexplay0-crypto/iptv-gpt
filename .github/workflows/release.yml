name: Publish Android release

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android native scaffolding
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --no-pub --platforms=android --org com.unexplay --project-name iptv "$RUNNER_TEMP/iptv-scaffold"
            cp -R "$RUNNER_TEMP/iptv-scaffold/android" ./android
          fi
          python3 tooling/configure_android.py android/app/src/main/AndroidManifest.xml

      - name: Install dependencies and verify
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Build release binaries
        run: |
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub

      - name: Publish APK and AAB to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
