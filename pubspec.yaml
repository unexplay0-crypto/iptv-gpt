name: iptv
description: UNEX Vision — aplicativo IPTV multiplataforma para Android e Android TV.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.2
  video_player: ^2.14.1
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
